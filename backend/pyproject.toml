[project]
name = "titanes-portfolio-backend"
version = "1.0.0"
description = "Custom ETF Portfolio Tracker — FastAPI + Polars backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "yfinance==0.2.61",
    "polars==0.20.31",
    "pyarrow>=14.0.0",
    "duckdb>=1.0.0",
    "pandas==2.2.2",
    "python-dateutil==2.9.0",
    "httpx==0.27.0",
    "redis>=8.1.0",
]

[dependency-groups]
dev = []
