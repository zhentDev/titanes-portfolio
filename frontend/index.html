    <!-- Monetag Vignette Banner (Profitable tag - Zone 11837655) con control de frecuencia -->
    <script>
    (function() {
      // Cooldown de 4 horas para no saturar al usuario
      const COOLDOWN_MS = 4 * 60 * 60 * 1000;
      const lastShown = localStorage.getItem('vignetteLastShown');
      if (lastShown && Date.now() - Number(lastShown) < COOLDOWN_MS) {
        return; // Aún en periodo de espera
      }

      function loadVignette() {
        if (window.__vignetteLoaded) return;
        window.__vignetteLoaded = true;
        localStorage.setItem('vignetteLastShown', Date.now());

        const s = document.createElement('script');
        s.dataset.zone = '11837655';
        s.src = 'https://nap5k.com/tag.min.js';
        (document.body || document.head || document.documentElement).appendChild(s);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadVignette, { once: true });
      } else {
        loadVignette();
      }
    })();
    </script>

    <script>
      // Live Auto-Healer Error Bridge (Development only)
      function _sendDevError(data) {
        fetch('http://localhost:8001/error', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(data)
        }).catch(() => {});
      }
      window.addEventListener('error', (e) => {
        _sendDevError({
          message: e.message,
          filename: e.filename,
          lineno: e.lineno,
          stack: e.error ? e.error.stack : ''
        });
      });
      window.addEventListener('unhandledrejection', (e) => {
        _sendDevError({
          message: e.reason ? (e.reason.message || String(e.reason)) : 'Unhandled Promise Rejection',
          stack: e.reason && e.reason.stack ? e.reason.stack : ''
        });
      });
    </script>
