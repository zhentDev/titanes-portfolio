    <!-- Monetag In-Page Push Ad Tag & Cooldown Control -->
    <script>
    (function() {
      // =========================================================================
      // ⏱️ PARÁMETRO DE TIEMPO DE ESPERA / COOLDOWN (Configurable en Horas)
      // Modifica este valor para cambiar cuánto tiempo esperar tras cerrar un anuncio.
      // Ejemplos: 4 = 4 horas, 12 = 12 horas, 24 = 1 día, 0.5 = 30 minutos.
      // =========================================================================
      const AD_COOLDOWN_HOURS = 6; 
      const COOLDOWN_MS = AD_COOLDOWN_HOURS * 60 * 60 * 1000;

      function isCooldownActive() {
        const stored = localStorage.getItem('monetagCooldown');
        if (!stored) return false;
        const expiry = Number(stored);
        if (Date.now() < expiry) {
          return true; // Aún está en periodo de espera
        }
        // Ya expiró, limpiar el cooldown antiguo
        localStorage.removeItem('monetagCooldown');
        return false;
      }

      function activateCooldown() {
        localStorage.setItem('monetagCooldown', Date.now() + COOLDOWN_MS);
      }

      function loadMonetagAds() {
        if (isCooldownActive()) return;

        var target = document.body || document.head || document.documentElement;
        if (!target) return;
        var s1 = document.createElement('script');
        s1.dataset.zone = '11837672';
        s1.src = 'https://nap5k.com/tag.min.js';
        target.appendChild(s1);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadMonetagAds);
      } else {
        loadMonetagAds();
      }

      // 1. Escucha clicks en botones nativos de cierre ('X' o botón de dismiss)
      document.addEventListener('click', function(e) {
        if (e.target && e.target.closest && e.target.closest('.monetag-close, .vignette-close, .close, [class*="close"], [aria-label*="close"]')) {
          activateCooldown();
        }
      }, true);

      // 2. Gesto de deslizar a un lado (Swipe-to-Dismiss) en pantallas táctiles
      let touchStartX = 0;
      let touchStartY = 0;
      let activeAdEl = null;

      function findAdContainer(target) {
        if (!target || !target.closest) return null;
        return target.closest('iframe[src*="nap5k"], iframe[src*="n6wxm"], [id*="monetag"], .monetag, .in-page-push, [class*="in-page-push"], div[id*="zone_"], div[data-zone]');
      }

      document.addEventListener('touchstart', function(e) {
        const adEl = findAdContainer(e.target);
        if (adEl && e.touches.length === 1) {
          activeAdEl = adEl;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      document.addEventListener('touchmove', function(e) {
        if (!activeAdEl || e.touches.length !== 1) return;
        const currentX = e.touches[0].clientX;
        const deltaX = currentX - touchStartX;
        const deltaY = e.touches[0].clientY - touchStartY;
        // Solo deslizar si el movimiento es predominantemente horizontal
        if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 10) {
          activeAdEl.style.transition = 'none';
          activeAdEl.style.transform = `translateX(${deltaX}px) scale(0.85)`;
          activeAdEl.style.opacity = `${Math.max(0.1, 1 - Math.abs(deltaX) / 220)}`;
        }
      }, { passive: true });

      document.addEventListener('touchend', function(e) {
        if (!activeAdEl) return;
        const touchEndX = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientX : touchStartX;
        const deltaX = touchEndX - touchStartX;

        if (Math.abs(deltaX) > 60) {
          // Deslizado exitoso: expulsar hacia el lado correspondiente y eliminar
          const flyOut = deltaX > 0 ? '120vw' : '-120vw';
          activeAdEl.style.transition = 'transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.25s ease';
          activeAdEl.style.transform = `translateX(${flyOut}) scale(0.8)`;
          activeAdEl.style.opacity = '0';
          
          setTimeout(() => {
            if (activeAdEl && activeAdEl.parentNode) {
              activeAdEl.parentNode.removeChild(activeAdEl);
            }
            activeAdEl = null;
          }, 300);

          activateCooldown();
        } else {
          // Si no alcanzó el umbral, retornar a la posición inicial
          activeAdEl.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
          activeAdEl.style.transform = '';
          activeAdEl.style.opacity = '1';
          activeAdEl = null;
        }
      }, { passive: true });

      // 3. Limitar a un SOLO anuncio en pantalla a la vez (evita apilamiento múltiple)
      function limitToOneAd() {
        const adSelector = 'iframe[src*="nap5k"], iframe[src*="n6wxm"], [id*="monetag"], .monetag, .in-page-push, [class*="in-page-push"], div[id*="zone_"], div[data-zone]';
        const ads = Array.from(document.querySelectorAll(adSelector)).filter(el => {
          // Filtrar tags de script o contenedores ocultos/destruidos
          return el.tagName !== 'SCRIPT' && (el.offsetWidth > 0 || el.offsetHeight > 0 || window.getComputedStyle(el).display !== 'none');
        });

        // Si hay más de 1 anuncio visible o inyectado, eliminar o esconder los subsiguientes
        if (ads.length > 1) {
          for (let i = 1; i < ads.length; i++) {
            try {
              if (ads[i].parentNode) {
                ads[i].parentNode.removeChild(ads[i]);
              } else {
                ads[i].style.setProperty('display', 'none', 'important');
              }
            } catch (e) {}
          }
        }

        // Forzar posicionamiento en la esquina inferior izquierda
        if (ads.length > 0) {
          const mainAd = ads[0];
          try {
            mainAd.style.setProperty('position', 'fixed', 'important');
            mainAd.style.setProperty('top', 'auto', 'important');
            mainAd.style.setProperty('right', 'auto', 'important');
            mainAd.style.setProperty('bottom', '20px', 'important');
            mainAd.style.setProperty('left', '20px', 'important');
            mainAd.style.setProperty('z-index', '999999', 'important');
          } catch (e) {}
        }
      }

      const adObserver = new MutationObserver(() => {
        limitToOneAd();
      });

      if (document.body) {
        adObserver.observe(document.body, { childList: true, subtree: true });
      } else {
        document.addEventListener('DOMContentLoaded', () => {
          adObserver.observe(document.body, { childList: true, subtree: true });
        });
      }
      setInterval(limitToOneAd, 1500);
    })();
    </script>
    <style>
    /* Ubicación en la esquina inferior izquierda y diseño base de los anuncios */
    iframe[src*="nap5k"], iframe[src*="n6wxm"], [id*="monetag"], .monetag, .in-page-push, [class*="in-page-push"], div[id*="zone_"], div[data-zone] {
      touch-action: pan-y !important;
      user-select: none !important;
      -webkit-user-select: none !important;
      position: fixed !important;
      top: auto !important;
      right: auto !important;
      bottom: 20px !important;
      left: 20px !important;
      z-index: 999999 !important;
    }

    /* Ocultar cualquier anuncio secundario si se generan múltiples contenedores */
    iframe[src*="nap5k"]:nth-of-type(n+2),
    iframe[src*="n6wxm"]:nth-of-type(n+2),
    .in-page-push:nth-of-type(n+2),
    [class*="in-page-push"]:nth-of-type(n+2),
    div[id*="zone_"]:nth-of-type(n+2),
    div[data-zone]:nth-of-type(n+2) {
      display: none !important;
    }

    /* Adaptación para pantallas pequeñas / móviles (<= 640px) */
    @media (max-width: 640px) {

    <script>
      // Live Auto-Healer Error Bridge (Development only)
      function _sendDevError(data) {
        fetch('http://localhost:8001/error', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(data)
        }).catch(() => {});
      }
      window.addEventListener('error', (e) => {
        _sendDevError({
          message: e.message,
          filename: e.filename,
          lineno: e.lineno,
          stack: e.error ? e.error.stack : ''
        });
      });
      window.addEventListener('unhandledrejection', (e) => {
        _sendDevError({
          message: e.reason ? (e.reason.message || String(e.reason)) : 'Unhandled Promise Rejection',
          stack: e.reason && e.reason.stack ? e.reason.stack : ''
        });
      });
    </script>
