<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Titanes Tech — Portfolio tracker personalizado. Simula una cesta de acciones tecnológicas como un ETF y compara contra S&P500 y NASDAQ." />
    <title>Titanes Tech · Portfolio Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Live Auto-Healer Error Bridge (Development only)
      function _sendDevError(data) {
        fetch('http://localhost:8001/error', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(data)
        }).catch(() => {});
      }
      window.addEventListener('error', (e) => {
        _sendDevError({
          message: e.message,
          filename: e.filename,
          lineno: e.lineno,
          stack: e.error ? e.error.stack : ''
        });
      });
      window.addEventListener('unhandledrejection', (e) => {
        _sendDevError({
          message: e.reason ? (e.reason.message || String(e.reason)) : 'Unhandled Promise Rejection',
          stack: e.reason && e.reason.stack ? e.reason.stack : ''
        });
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
