    <!-- Monetag In-Page Push & Vignette Ad Tags -->
    <script>
    (function() {
      function loadMonetagAds() {
        if (!localStorage.getItem('monetagCooldown')) {
          var target = document.body || document.head || document.documentElement;
          if (!target) return;
          // Carga únicamente un script de anuncio (In-Page Push) para evitar banners duplicados apilados
          var s1 = document.createElement('script');
          s1.dataset.zone = '11837652';
          s1.src = 'https://nap5k.com/tag.min.js';
          target.appendChild(s1);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadMonetagAds);
      } else {
        loadMonetagAds();
      }

      // Listen for ad close events to set cooldown (45 minutes)
      document.addEventListener('click', function(e) {
        if (e.target && e.target.closest && e.target.closest('.monetag-close, .vignette-close, .close')) {
          localStorage.setItem('monetagCooldown', Date.now() + 45*60*1000);
        }
      });
    })();
    </script>
    <style>
    /* Force Monetag ads and push notifications to bottom-left corner */
    iframe[src*="nap5k"], iframe[src*="n6wxm"], [id*="monetag"], .monetag, .in-page-push, [class*="in-page-push"], div[id*="zone_"], div[data-zone] {
      position: fixed !important;
      bottom: 16px !important;
      left: 16px !important;
      top: auto !important;

  <body>
    <div id="root"></div>
    <script>
      // Live Auto-Healer Error Bridge (Development only)
      function _sendDevError(data) {
        fetch('http://localhost:8001/error', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(data)
        }).catch(() => {});
      }
      window.addEventListener('error', (e) => {
        _sendDevError({
          message: e.message,
          filename: e.filename,
          lineno: e.lineno,
          stack: e.error ? e.error.stack : ''
        });
      });
      window.addEventListener('unhandledrejection', (e) => {
        _sendDevError({
          message: e.reason ? (e.reason.message || String(e.reason)) : 'Unhandled Promise Rejection',
          stack: e.reason && e.reason.stack ? e.reason.stack : ''
        });
      });
    </script>
