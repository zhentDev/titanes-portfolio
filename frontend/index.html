    <!-- Monetag In-Page Push Ad Tag & Cooldown Control -->
    <script>
    (function() {
      // =========================================================================
      // ⏱️ PARÁMETRO DE TIEMPO DE ESPERA / COOLDOWN (Configurable en Horas)
      // Modifica este valor para cambiar cuánto tiempo esperar tras cerrar un anuncio.
      // Ejemplos: 4 = 4 horas, 12 = 12 horas, 24 = 1 día, 0.5 = 30 minutos.
      // =========================================================================
      const AD_COOLDOWN_HOURS = 6; 
      const COOLDOWN_MS = AD_COOLDOWN_HOURS * 60 * 60 * 1000;

      function isCooldownActive() {
        const stored = localStorage.getItem('monetagCooldown');
        if (!stored) return false;
        const expiry = Number(stored);
        if (Date.now() < expiry) {
          return true; // Aún está en periodo de espera
        }
        // Ya expiró, limpiar el cooldown antiguo
        localStorage.removeItem('monetagCooldown');
        return false;
      }

      function activateCooldown() {
        localStorage.setItem('monetagCooldown', Date.now() + COOLDOWN_MS);
      }

      // Flag global para garantizar que NUNCA se inyecte el script de Monetag dos veces
      window.__monetagLoaded = false;

      function loadMonetagAds() {
        if (window.__monetagLoaded) return;
        if (isCooldownActive()) return;

        // Comprobar si ya existe un script de Monetag en el DOM
        if (document.querySelector('script[src*="nap5k.com"], script[data-zone="11837672"]')) {
          window.__monetagLoaded = true;
          return;
        }

        var target = document.body || document.head || document.documentElement;
        if (!target) return;
        window.__monetagLoaded = true;
        var s1 = document.createElement('script');
        s1.dataset.zone = '11837672';
        s1.src = 'https://nap5k.com/tag.min.js';
        target.appendChild(s1);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadMonetagAds, { once: true });
      } else {
        loadMonetagAds();
      }

      // 1. Escucha clicks en botones nativos de cierre ('X' o botón de dismiss)
      document.addEventListener('click', function(e) {
        if (e.target && e.target.closest && e.target.closest('.monetag-close, .vignette-close, .close, [class*="close"], [aria-label*="close"]')) {
          activateCooldown();
        }
      }, true);

      // 2. Gesto de deslizar a un lado (Swipe-to-Dismiss) en pantallas táctiles
      let touchStartX = 0;
      let touchStartY = 0;
      let activeAdEl = null;

      function isAdElement(el) {
        if (!el || el.nodeType !== 1 || el.tagName === 'SCRIPT' || el.tagName === 'STYLE') return false;
        
        // Comprobar si coincide con selectores o orígenes conocidos de Monetag
        if (el.matches && el.matches('iframe[src*="nap5k"], iframe[src*="n6wxm"], [id*="monetag"], .monetag, .in-page-push, [class*="in-page-push"], div[id*="zone_"], div[data-zone]')) {
          return true;
        }

        // Inspeccionar si es una tarjeta flotante de anuncio (por ejemplo badge "Ad", "Anuncio", o z-index astronómico)
        const text = (el.innerText || '').trim();
        const hasAdBadge = el.querySelector && el.querySelector('.ad, [class*="ad-badge"], [class*="badge"], span, div');
        if (text.startsWith('Ad') || text.includes('Ad\n') || text.includes('Ad ') || text.includes('WPS Office')) {
          return true;
        }

        // Elemento directo del body con posición fixed y z-index > 50000
        if (el.parentNode === document.body || el.parentNode === document.documentElement) {
          try {
            const cs = window.getComputedStyle(el);
            const z = parseInt(cs.zIndex, 10);
            if ((cs.position === 'fixed' || cs.position === 'absolute') && z > 50000) {
              return true;
            }
          } catch (e) {}
        }
        return false;
      }

      function findAdContainer(target) {
        if (!target || !target.closest) return null;
        let found = target.closest('iframe[src*="nap5k"], iframe[src*="n6wxm"], [id*="monetag"], .monetag, .in-page-push, [class*="in-page-push"], div[id*="zone_"], div[data-zone]');
        if (found) return found;

        let curr = target;
        while (curr && curr !== document.body && curr !== document.documentElement) {
          if (isAdElement(curr)) return curr;
          curr = curr.parentElement;
        }
        return null;
      }

      document.addEventListener('touchstart', function(e) {
        const adEl = findAdContainer(e.target);
        if (adEl && e.touches.length === 1) {
          activeAdEl = adEl;
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      document.addEventListener('touchmove', function(e) {
        if (!activeAdEl || e.touches.length !== 1) return;
        const currentX = e.touches[0].clientX;
        const deltaX = currentX - touchStartX;
        const deltaY = e.touches[0].clientY - touchStartY;
        if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 10) {
          activeAdEl.style.transition = 'none';
          activeAdEl.style.transform = `translateX(${deltaX}px) scale(0.85)`;
          activeAdEl.style.opacity = `${Math.max(0.1, 1 - Math.abs(deltaX) / 220)}`;
        }
      }, { passive: true });

      document.addEventListener('touchend', function(e) {
        if (!activeAdEl) return;
        const touchEndX = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientX : touchStartX;
        const deltaX = touchEndX - touchStartX;

        if (Math.abs(deltaX) > 60) {
          const flyOut = deltaX > 0 ? '120vw' : '-120vw';
          activeAdEl.style.transition = 'transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.25s ease';
          activeAdEl.style.transform = `translateX(${flyOut}) scale(0.8)`;
          activeAdEl.style.opacity = '0';
          
          setTimeout(() => {
            if (activeAdEl && activeAdEl.parentNode) {
              activeAdEl.parentNode.removeChild(activeAdEl);
            }
            activeAdEl = null;
          }, 300);

          activateCooldown();
        } else {
          activeAdEl.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
          activeAdEl.style.transform = '';
          activeAdEl.style.opacity = '1';
          activeAdEl = null;
        }
      }, { passive: true });

      // 3. Limitar a un SOLO anuncio en pantalla a la vez y reposicionar abajo a la izquierda
      function limitToOneAd() {
        const found = [];
        
        // 1. Selector estándar
        const selAds = document.querySelectorAll('iframe[src*="nap5k"], iframe[src*="n6wxm"], [id*="monetag"], .monetag, .in-page-push, [class*="in-page-push"], div[id*="zone_"], div[data-zone]');
        selAds.forEach(el => {
          if (!found.includes(el)) found.push(el);
        });

        // 2. Todos los elementos directos del body o documentElement con fixed position y alto z-index
        if (document.body) {
          for (let i = 0; i < document.body.children.length; i++) {
            const child = document.body.children[i];
            if (isAdElement(child) && !found.includes(child)) {
              found.push(child);
            }
          }
        }

        const validAds = found.filter(el => {
          return el.tagName !== 'SCRIPT' && el.tagName !== 'STYLE' && (el.offsetWidth > 0 || el.offsetHeight > 0 || window.getComputedStyle(el).display !== 'none');
        });

        // Si hay más de 1 anuncio, destruir inmediatamente los duplicados
        if (validAds.length > 1) {
          for (let i = 1; i < validAds.length; i++) {
            try {
              validAds[i].remove();
            } catch (e) {
              if (validAds[i].parentNode) {
                validAds[i].parentNode.removeChild(validAds[i]);
              }
            }
          }
        }

        // Forzar al primer anuncio a ubicarse en la esquina inferior izquierda
        if (validAds.length > 0) {
          const ad = validAds[0];
          try {
            ad.style.setProperty('position', 'fixed', 'important');
            ad.style.setProperty('top', 'auto', 'important');
            ad.style.setProperty('right', 'auto', 'important');
            ad.style.setProperty('bottom', '20px', 'important');
            ad.style.setProperty('left', '20px', 'important');
            ad.style.setProperty('z-index', '2147483647', 'important');
            ad.style.setProperty('margin', '0', 'important');
            ad.classList.add('monetag-bottom-left-pinned');
          } catch (e) {}
        }
      }

      const adObserver = new MutationObserver(() => {
        limitToOneAd();
      });

      if (document.body) {
        adObserver.observe(document.body, { childList: true, subtree: true });
      } else {
        document.addEventListener('DOMContentLoaded', () => {
          adObserver.observe(document.body, { childList: true, subtree: true });
        });
      }
      setInterval(limitToOneAd, 400);
    })();
    </script>

      // Live Auto-Healer Error Bridge (Development only)
      function _sendDevError(data) {
        fetch('http://localhost:8001/error', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(data)
        }).catch(() => {});
      }
      window.addEventListener('error', (e) => {
        _sendDevError({
          message: e.message,
          filename: e.filename,
          lineno: e.lineno,
          stack: e.error ? e.error.stack : ''
        });
      });
      window.addEventListener('unhandledrejection', (e) => {
        _sendDevError({
          message: e.reason ? (e.reason.message || String(e.reason)) : 'Unhandled Promise Rejection',
          stack: e.reason && e.reason.stack ? e.reason.stack : ''
        });
      });
